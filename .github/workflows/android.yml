name: Android verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
  ORS_KEY: ${{ secrets.ORS_KEY }}
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Time the free data services (for diagnosis)
        continue-on-error: true
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          t() { echo "== $1"; curl -s -o /tmp/out -w "http=%{http_code} time=%{time_total}s\n" -m 40 "${@:2}" || echo "failed"; head -c 200 /tmp/out; echo; }
          Q='[out:json][timeout:15];nwr(around:1500,28.4744,77.4865)["amenity"="toilets"];out center tags 60;'
          t overpass-de -G --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter
          t kumi -G --data-urlencode "data=$Q" https://overpass.kumi.systems/api/interpreter
          t private-coffee -G --data-urlencode "data=$Q" https://overpass.private.coffee/api/interpreter
          t maptiler-poi "https://api.maptiler.com/geocoding/hospital.json?key=$MAPTILER_KEY&proximity=77.4865,28.4744&types=poi&limit=10"
          t open-meteo "https://api.open-meteo.com/v1/forecast?latitude=28.47&longitude=77.49&current=temperature_2m"
          t osrm-car "https://routing.openstreetmap.de/routed-car/route/v1/driving/77.4865,28.4744;77.2433,28.5677?overview=false&alternatives=3&exclude=toll"
      - run: chmod +x gradlew
      - name: Unit tests, lint, debug and release builds
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accesspath-apks-and-reports
          path: |
            app/build/outputs/apk/
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/
            app/build/test-results/
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace || (adb logcat -d -v brief AndroidRuntime:E ActivityTaskManager:I ActivityManager:I '*:S' | tail -200; exit 1)
      - name: Print test failure details
        if: failure()
        run: |
          find app/build/outputs/androidTest-results -name '*.xml' -print0 | xargs -0 grep -h -A25 '<failure' | head -400 || true
      - name: Print screenshots to the log (for review tools that cannot download artifacts)
        if: always() && matrix.api-level == 35
        run: |
          find app/build/outputs/connected_android_test_additional_output -name '*.png' -print0 | sort -z |
            while IFS= read -r -d '' f; do
              echo "SCREENSHOT_BEGIN $(basename "$f")"; base64 -w0 "$f"; echo; echo "SCREENSHOT_END"
            done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
