name: probe-data-sources
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Time the place, weather and routing services
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          t() { echo "== $1"; curl -s -o /tmp/out -w "http=%{http_code} time=%{time_total}s\n" -m 60 "${@:2}"; head -c 300 /tmp/out; echo; }
          Q='[out:json][timeout:15];nwr(around:1500,28.4744,77.4865)["amenity"="toilets"];out center tags 60;'
          t overpass-post -X POST --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter
          t overpass-get -G --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter
          t kumi-post -X POST --data-urlencode "data=$Q" https://overpass.kumi.systems/api/interpreter
          t private-coffee -X POST --data-urlencode "data=$Q" https://overpass.private.coffee/api/interpreter
          t maptiler-poi "https://api.maptiler.com/geocoding/hospital.json?key=$MAPTILER_KEY&proximity=77.4865,28.4744&types=poi&limit=10"
          t open-meteo "https://api.open-meteo.com/v1/forecast?latitude=28.47&longitude=77.49&current=temperature_2m"
          t osrm-car "https://routing.openstreetmap.de/routed-car/route/v1/driving/77.4865,28.4744;77.2433,28.5677?overview=false&alternatives=3&exclude=toll"
